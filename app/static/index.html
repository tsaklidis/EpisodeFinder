<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κωνσταντίνου και Ελένης</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-frame">
            <h1>Κωνσταντίνου <span class="ampersand">κ</span> Ελένης</h1>
            <p class="tagline">Αναζήτηση φράσης</p>
        </div>
    </header>

    <main class="container">
        <div class="search-box">
            <div class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <input
                type="text"
                id="searchInput"
                placeholder="Αναζήτηση φράσης..."
                autocomplete="off"
                autofocus
                maxlength="100"
            >
            <div id="inputHint" class="input-hint" role="status" aria-live="polite"></div>
        </div>

        <div id="stats" class="stats"></div>
        <div id="results" class="results">
            <div class="empty-state">
                <div class="empty-icon">📺</div>
                <div>Πληκτρολογήστε μια φράση για αναζήτηση</div>
                <div class="empty-hint">π.χ. «αποχετευτικό», «δεσποινίς Βλαχάκη», «Μαρούσι»</div>
            </div>
        </div>
        <div id="pagination" class="pagination"></div>
    </main>

    <footer class="footer">
        <span>Κωνσταντίνου και Ελένης - 1998</span>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
